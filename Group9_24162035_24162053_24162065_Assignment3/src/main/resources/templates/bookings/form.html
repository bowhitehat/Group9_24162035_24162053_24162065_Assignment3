<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh Sửa Đặt Phòng' : 'Tạo Mới Đặt Phòng'}">Đặt Phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .form-card {
            max-width: 680px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            background: white;
            padding: 32px;
        }
        .field-error {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            font-weight: 500;
        }
        .form-label {
            font-weight: 600;
            color: #343a40;
            margin-bottom: 6px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .form-control.is-invalid:focus {
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.18);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="form-card">
        <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
            <div>
                <h3 class="fw-bold mb-1 text-dark">
                    <i th:class="${isEdit ? 'bi bi-pencil-square text-primary me-2' : 'bi bi-calendar-plus text-primary me-2'}"></i>
                    <span th:text="${isEdit ? 'Chỉnh Sửa Đặt Phòng #' + bookingId : 'Tạo Mới Đặt Phòng'}">Đặt Phòng</span>
                </h3>
                <p class="text-muted small mb-0">Vui lòng điền đầy đủ các trường thông tin bên dưới</p>
            </div>
            <a th:href="@{/bookings}" class="btn btn-outline-secondary btn-sm px-3">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
        </div>

        <!-- Yêu cầu đề bài: Không dùng banner chung cho cả form. 
             Mỗi thông báo lỗi (th:errors) phải xuất hiện ngay sát dưới/bên cạnh từng ô nhập liệu. 
             Th:field tự động lưu giữ toàn bộ dữ liệu người dùng đã nhập nếu có lỗi validation. -->
        <form th:action="${isEdit} ? @{/bookings/{id}/edit(id=${bookingId})} : @{/bookings}"
              th:object="${bookingFormDto}"
              method="post" novalidate>

            <!-- 1. Tên Phòng (roomName) -->
            <div class="mb-3">
                <label for="roomName" class="form-label">
                    Tên Phòng <span class="text-danger">*</span>
                </label>
                <input type="text"
                       id="roomName"
                       th:field="*{roomName}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('roomName')} ? 'is-invalid' : ''"
                       placeholder="Ví dụ: A101, B202, Hội trường C...">
                <div class="field-error" th:if="${#fields.hasErrors('roomName')}">
                    <i class="bi bi-exclamation-circle-fill me-1"></i>
                    <span th:errors="*{roomName}">Lỗi tên phòng</span>
                </div>
            </div>

            <!-- 2. Người Đặt (bookedBy) -->
            <div class="mb-3">
                <label for="bookedBy" class="form-label">
                    Người Đặt (Họ tên / MSSV) <span class="text-danger">*</span>
                </label>
                <input type="text"
                       id="bookedBy"
                       th:field="*{bookedBy}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('bookedBy')} ? 'is-invalid' : ''"
                       placeholder="Ví dụ: Nguyen Van A - 24162035">
                <div class="field-error" th:if="${#fields.hasErrors('bookedBy')}">
                    <i class="bi bi-exclamation-circle-fill me-1"></i>
                    <span th:errors="*{bookedBy}">Lỗi người đặt</span>
                </div>
            </div>

            <!-- 3. Thời Gian Bắt Đầu & Kết Thúc (startAt & endAt) -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="startAt" class="form-label">
                        Thời Gian Bắt Đầu <span class="text-danger">*</span>
                    </label>
                    <input type="datetime-local"
                           id="startAt"
                           th:field="*{startAt}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('startAt')} ? 'is-invalid' : ''">
                    <div class="field-error" th:if="${#fields.hasErrors('startAt')}">
                        <i class="bi bi-exclamation-circle-fill me-1"></i>
                        <span th:errors="*{startAt}">Lỗi thời gian bắt đầu</span>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="endAt" class="form-label">
                        Thời Gian Kết Thúc <span class="text-danger">*</span>
                    </label>
                    <input type="datetime-local"
                           id="endAt"
                           th:field="*{endAt}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('endAt')} ? 'is-invalid' : ''">
                    <div class="field-error" th:if="${#fields.hasErrors('endAt')}">
                        <i class="bi bi-exclamation-circle-fill me-1"></i>
                        <span th:errors="*{endAt}">Lỗi thời gian kết thúc</span>
                    </div>
                </div>
            </div>

            <!-- 4. Mục Đích Sử Dụng (purpose) -->
            <div class="mb-4">
                <label for="purpose" class="form-label">
                    Mục Đích Sử Dụng <span class="text-danger">*</span>
                </label>
                <textarea id="purpose"
                          th:field="*{purpose}"
                          rows="3"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('purpose')} ? 'is-invalid' : ''"
                          placeholder="Ví dụ: Họp nhóm đồ án Lập trình Web, phỏng vấn ứng viên..."></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('purpose')}">
                    <i class="bi bi-exclamation-circle-fill me-1"></i>
                    <span th:errors="*{purpose}">Lỗi mục đích sử dụng</span>
                </div>
            </div>

            <!-- Các nút thao tác -->
            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                <a th:href="@{/bookings}" class="btn btn-light px-4 border">
                    Hủy bỏ
                </a>
                <button type="submit" class="btn btn-primary px-4 shadow-sm fw-medium">
                    <i class="bi bi-check-lg me-1"></i>
                    <span th:text="${isEdit ? 'Lưu Thay Đổi' : 'Xác Nhận Đặt Phòng'}">Lưu</span>
                </button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
